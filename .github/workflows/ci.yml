name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: recsys, POSTGRES_USER: recsys, POSTGRES_PASSWORD: recsys }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recsys" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
        with: { version: "0.13.8", enable-cache: true }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync --locked --all-groups
      - run: cd frontend && npm ci
      - run: uv run ruff check backend tests migrations
      - run: uv run pytest -q
      - run: cd frontend && npm run lint && npm test -- --run && npm run build
      - name: Verify clean migration chain and schema parity
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://recsys:recsys@localhost:5432/recsys
      - run: docker-compose config --quiet
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -f Dockerfile.api -t recsys-api:test .
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -f Dockerfile.web.prod -t recsys-web:test .
      - name: Verify image revision labels
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' recsys-api:test)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' recsys-web:test)" = "$GITHUB_SHA"
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10
        with: { version: "0.13.8" }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv export --locked --no-dev --format requirements-txt > /tmp/requirements.txt
      - run: uvx --python 3.12 pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - run: cd frontend && npm ci && npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
