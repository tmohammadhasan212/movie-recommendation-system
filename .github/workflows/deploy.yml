name: Manual VPS deploy
on:
  workflow_dispatch:
    inputs:
      image_sha: { description: "CI-tested Git SHA to deploy", required: true }
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.image_sha }}
          fetch-depth: 0
      - name: Validate deployment revision
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$IMAGE_SHA" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#IMAGE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$IMAGE_SHA"
          git merge-base --is-ancestor "$IMAGE_SHA" "origin/$DEFAULT_BRANCH"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Deploy tested images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/recsys && git fetch --depth=1 origin '$IMAGE_SHA' && git checkout --detach '$IMAGE_SHA' && ./infra/deploy.sh '$IMAGE_SHA'"
