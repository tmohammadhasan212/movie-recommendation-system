name: Release images
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/recsys-api:${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/recsys-web:${{ github.event.workflow_run.head_sha }}
