[project]
name = "recsys"
version = "0.1.0"
description = "Non-commercial MovieLens recommendation demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "celery==5.7.0",
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "packaging==26.3",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "redis==8.1.0",
    "safetensors==0.8.0",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
ml = [
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "torch==2.15.0",
]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
