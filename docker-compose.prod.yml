services:
  api:
    image: ${RECSYS_API_IMAGE:-recsys-api:local}
    ports: !reset []
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
  web:
    image: ${RECSYS_WEB_IMAGE:-recsys-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web.prod
    ports: !reset []
  proxy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped
  db:
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
  redis:
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }
volumes:
  caddy_data:
  caddy_config:
